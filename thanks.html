<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="refresh" content="1;url=https://www.ymipartners.co.kr/" />
    <title>상담 접수 완료 | YMI Partners</title>
    <style>
      :root { color-scheme: light; font-family: Pretendard, "Noto Sans KR", Arial, sans-serif; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; color: #17212b; background: #f1f5f6; }
      main { width: min(92%, 560px); padding: 56px 32px; border: 1px solid #d9e0e4; background: #fff; text-align: center; box-shadow: 0 18px 50px rgba(16, 25, 35, .1); }
      p { margin: 0 0 14px; line-height: 1.7; }
      .eyebrow { color: #187c86; font-size: .78rem; font-weight: 800; letter-spacing: .14em; }
      h1 { margin: 18px 0 12px; font-size: clamp(2rem, 7vw, 3rem); letter-spacing: -.06em; }
      .message { color: #64707b; }
      a { color: #0f606a; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">YMI PARTNERS</p>
      <h1>전송 되었습니다</h1>
      <p class="message">상담 내용이 정상적으로 접수되었습니다.<br />잠시 후 홈페이지로 이동합니다.</p>
      <a href="https://www.ymipartners.co.kr/">바로 홈페이지로 이동</a>
    </main>
    <script>
      window.setTimeout(function () {
        window.location.replace("https://www.ymipartners.co.kr/");
      }, 1000);
    </script>
  </body>
</html>
